name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - hardening/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: Lint and type validation
        run: npm run lint
      - name: Production build
        run: npm run build
